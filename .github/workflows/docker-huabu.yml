name: Huabu Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/sivyer9303/bytego-canvas

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_BASE=/huabu/
          tags: |
            ${{ env.IMAGE_NAME }}:huabu
            ${{ env.IMAGE_NAME }}:huabu-${{ github.sha }}
          cache-from: type=gha,scope=huabu
          cache-to: type=gha,mode=max,scope=huabu
