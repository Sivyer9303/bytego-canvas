# 主站画布。服务器只需这一份文件，不必再 clone 源码。
#
# 正式：
#   docker compose -f docker-compose.huabu.yml up -d
# 不改现有 nginx、先在本机 8080 试：
#   docker compose -f docker-compose.huabu.yml --profile test up -d
#   打开 http://127.0.0.1:8080/huabu/
#   测完：docker compose -f docker-compose.huabu.yml --profile test down
#
# 镜像：ghcr.io/sivyer9303/bytego-canvas:huabu
# 正式上线仍需在主站 nginx 加一次 /huabu/。从站不用改。

services:
  canvas:
    image: ghcr.io/sivyer9303/bytego-canvas:huabu
    container_name: canvas
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - newapi

  gateway:
    profiles: ["test"]
    image: nginx:1.27-alpine
    container_name: canvas-huabu-test
    restart: unless-stopped
    ports:
      - "${HUABU_TEST_PORT:-127.0.0.1:8080}:80"
    depends_on:
      - canvas
    networks:
      - newapi
    configs:
      - source: test_gateway
        target: /etc/nginx/conf.d/default.conf

networks:
  newapi:
    name: proxy_newapi-network
    external: true

configs:
  test_gateway:
    content: |
      map $$http_upgrade $$connection_upgrade {
          default upgrade;
          ''      close;
      }
      server {
          listen 80;
          server_name _;
          client_max_body_size 100m;
          location = /huabu {
              return 301 /huabu/;
          }
          location ^~ /huabu/ {
              proxy_pass http://canvas:3000;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
          }
          location / {
              proxy_pass http://new-api:3000;
              proxy_http_version 1.1;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection $$connection_upgrade;
              proxy_buffering off;
              proxy_read_timeout 600s;
          }
      }
