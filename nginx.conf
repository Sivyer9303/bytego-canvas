server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin mount for new-api. Dist is copied to /huabu/ when VITE_BASE=/huabu/.
    location /huabu/ {
        try_files $uri $uri/ /huabu/index.html;
    }

    location = /huabu/config.js {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
