# ==================== HTTP 重定向到 HTTPS ====================
server {
    listen 80;
    server_name bytego.team www.bytego.team api.bytego.team;

    return 301 https://$host$request_uri;
}

# ==================== HTTPS 主服务器 ====================
server {
    listen 443 ssl;
    http2 on;
    server_name bytego.team www.bytego.team api.bytego.team;

    ssl_certificate     /etc/nginx/ssl/api.pem;
    ssl_certificate_key /etc/nginx/ssl/api.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/api-access.log main;
    error_log  /var/log/nginx/api-error.log warn;

    client_max_body_size 100m;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    proxy_connect_timeout 300s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options              "SAMEORIGIN"      always;
    add_header X-Content-Type-Options       "nosniff"         always;
    add_header X-XSS-Protection             "1; mode=block"   always;

    # ---------- 无限画布（必须 ^~，否则 js/css 正则会把 /huabu/assets 送到 new-api） ----------
    location = /huabu {
        return 301 /huabu/;
    }

    location ^~ /huabu/ {
        add_header Cache-Control "no-store" always;
        proxy_pass http://canvas:3000;
        proxy_buffering off;
        proxy_cache off;
    }

    # ---------- 成片下载：转到从站 new-api（必须放在 /v1/ 前面，且不要用 ^~ 挡正则） ----------

    # ---------- 接口：禁缓存（注意：这里不要写 ^~，否则会盖住上面的 content 规则） ----------
    location /v1/ {
        add_header Cache-Control "no-store" always;

        proxy_pass http://new-api:3000;
        proxy_buffering off;
        proxy_cache off;
    }

    # ---------- 静态资源：长缓存 ----------
    location ~* \.(?:js|mjs|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|map)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        proxy_pass http://new-api:3000;
        proxy_buffering on;
        proxy_cache off;
    }

    # ---------- HTML / 其他兜底 ----------
    location / {
        add_header Cache-Control "no-store" always;

        proxy_pass http://new-api:3000;
        proxy_buffering off;
        proxy_cache off;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}
