# 插入主站 HTTPS server，放在 location /v1/ 之前。必须用 ^~。
# 从站不用加：www 的 location / 已经转到主站。

    location = /huabu {
        return 301 /huabu/;
    }

    location ^~ /huabu/ {
        add_header Cache-Control "no-store" always;
        proxy_pass http://canvas:3000;
        proxy_buffering off;
        proxy_cache off;
    }
